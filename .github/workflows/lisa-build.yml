name: Build ylmzer-HyperOSPro kernel
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Configuration audit or full kernel build
        type: choice
        options: [config-only, zram-only, build]
        default: config-only
      package:
        description: Produce the ylmzer-HyperOSPro AnyKernel3 ZIP (full build only)
        type: boolean
        default: false
      boot_log:
        description: Enable bounded boot logging to lisa's dedicated oops partition
        type: boolean
        default: false
      zygote_diag:
        description: Log bounded native zygote initialization syscalls (diagnosis only)
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex make gcc g++ libssl-dev libelf-dev \
            libncurses-dev python3 rsync zip clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi ccache
      - name: Restore compiler cache
        if: inputs.mode == 'build'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/ccache
          key: ${{ runner.os }}-lisa-clang14-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-lisa-clang14-
      - name: Verify case-sensitive upstream files
        run: python3 .lisa/tests/source_integrity.py
      - name: Verify LZ4KD page round-trips
        run: |
          mkdir -p dist/lisa out/tests
          gcc -std=gnu11 -O2 -g -fsanitize=address,undefined -fno-sanitize=alignment \
            -include .lisa/tests/codec_host.h -iquote include/linux -iquote lib/lz4kd \
            .lisa/tests/lz4kd_roundtrip.c lib/lz4kd/lz4kd_encode.c lib/lz4kd/lz4kd_decode.c \
            -o out/tests/lz4kd-roundtrip
          out/tests/lz4kd-roundtrip | tee dist/lisa/codec-test.txt
      - name: Verify boot-log recovery and corruption handling
        run: python3 .lisa/tests/test_bootlog_decode.py
      - name: Verify netbpfload uname compatibility boundaries
        run: python3 .lisa/tests/test_netbpfload_compat.py
      - name: Verify checkpoint capability and namespace permission boundaries
        run: python3 .lisa/tests/test_checkpoint_capability.py | tee dist/lisa/checkpoint-capability-test.txt
      - name: Verify Millet ABI and untrusted netlink rejection
        run: python3 .lisa/tests/test_millet.py | tee dist/lisa/millet-test.txt
      - name: Verify native zygote diagnostic scope and hard quota
        run: python3 .lisa/tests/test_zygote_diag.py
      - name: Verify MIUI display ABI and asynchronous payload ownership
        run: python3 .lisa/tests/test_mi_display.py | tee dist/lisa/mi-display-test.txt
      - name: Verify built-in WLAN HAL startup and load failure handling
        run: python3 .lisa/tests/test_wlan_startup.py | tee dist/lisa/wlan-startup-test.txt
      - name: Verify Lisa and native MI2S interface namespaces
        run: python3 .lisa/tests/test_mi2s_namespace.py | tee dist/lisa/mi2s-namespace-test.txt
      - name: Compile opt-in boot recorder before the full build
        if: inputs.mode == 'build' && inputs.boot_log
        env:
          USE_CCACHE: '1'
          BOOT_LOG: '1'
          ZYGOTE_DIAG: ${{ inputs.zygote_diag && '1' || '0' }}
        run: bash .lisa/build.sh bootlog-only
      - name: Compile and verify built-in vendor drivers
        if: inputs.mode == 'build'
        env:
          USE_CCACHE: '1'
          BOOT_LOG: ${{ inputs.boot_log && '1' || '0' }}
          ZYGOTE_DIAG: ${{ inputs.zygote_diag && '1' || '0' }}
        run: bash .lisa/build.sh vendor-only
      - name: Configure and build
        env:
          USE_CCACHE: '1'
          BOOT_LOG: ${{ inputs.boot_log && '1' || '0' }}
          ZYGOTE_DIAG: ${{ inputs.zygote_diag && '1' || '0' }}
        run: bash .lisa/build.sh '${{ inputs.mode }}'
      - name: Checkout pinned AnyKernel3 installer
        if: inputs.mode == 'build' && inputs.package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: osm0sis/AnyKernel3
          ref: 020dfeccf9d7e962a48400fc94d3e451df92eead
          path: out/anykernel
      - name: Package ylmzer-HyperOSPro image
        if: inputs.mode == 'build' && inputs.package
        env:
          BOOT_LOG: ${{ inputs.boot_log && '1' || '0' }}
          ZYGOTE_DIAG: ${{ inputs.zygote_diag && '1' || '0' }}
        run: |
          cp .lisa/anykernel.sh out/anykernel/anykernel.sh
          if [ '${{ inputs.boot_log }}' = true ]; then
            sed -i '/^write_boot;/i patch_cmdline lisa_bootlog "lisa_bootlog=1";' out/anykernel/anykernel.sh
          fi
          cp dist/lisa/Image out/anykernel/Image
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import hashlib
          from datetime import datetime, timedelta, timezone
          root = Path('out/anykernel')
          stamp = datetime.now(timezone(timedelta(hours=3))).strftime('%d-%m-%Y-%H-%M')
          package_name = f'ylmzer-HyperOSPro-{stamp}.zip'
          package_path = Path('dist/lisa') / package_name
          with zipfile.ZipFile(package_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  relative = path.relative_to(root)
                  if not path.is_file() or any(part.startswith('.') for part in relative.parts):
                      continue
                  if path.name == 'README.md' or 'placeholder' in path.name:
                      continue
                  archive.write(path, relative.as_posix())
          with (package_path.parent / 'SHA256SUMS').open('a', encoding='utf-8') as checksums:
              checksums.write(f"{hashlib.sha256(package_path.read_bytes()).hexdigest()}  {package_name}\n")
          PY
      - name: Record compiler cache statistics
        if: always() && inputs.mode == 'build'
        run: |
          mkdir -p dist/lisa
          CCACHE_DIR="$GITHUB_WORKSPACE/out/ccache" ccache --show-stats > dist/lisa/ccache-stats.txt
      - name: Save compiler cache even after a build failure
        if: always() && inputs.mode == 'build'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/ccache
          key: ${{ runner.os }}-lisa-clang14-${{ github.run_id }}
      - name: Preserve logs and artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ylmzer-HyperOSPro-${{ inputs.mode }}-${{ github.run_id }}
          path: dist/lisa/
          if-no-files-found: warn
          retention-days: 14
